<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoHub - Адмін-панель</title>
    <style>
        /* Екран входу (центрування всього) */
    /* Базові стилі */
    body { background: #0a0f1e; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }

    /* Екран входу */
    #login-screen { 
        position: fixed; top: 0; left: 0; 
        width: 100%; height: 100%; 
        background: #0a0f1e; 
        display: flex; justify-content: center; align-items: center; 
        z-index: 9999; 
    }
    .login-box { 
        background: #1a2233; padding: 30px; border-radius: 15px; 
        border: 1px solid #4a90e2; text-align: center; width: 300px; 
    }
    .login-box input { 
        width: 100%; padding: 10px; margin-bottom: 10px; 
        border-radius: 5px; border: none; background: #000; 
        color: white; box-sizing: border-box; 
    }

    /* --- УНІФІКОВАНА КНОПКА "НАЗАД" --- */
    /* Вона виглядає однаково і на екрані логіна, і в адмінці */
    .back-login-btn, .back-link {
        display: inline-block;
        padding: 10px 20px;
        background-color: #1a2233; /* той самий колір */
        border: 1px solid #4a90e2; /* та сама рамка */
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-weight: 500;
        cursor: pointer;
    }
    .back-login-btn:hover, .back-link:hover {
        background-color: #1a2233;
        color: #ffd700;    /* жовтий текст */
        border-color: #ffd700; /* жовта рамка */
        transform: translateY(-2px);
    }

    /* Спеціальне позиціонування кнопки логіна (відсунули від кута) */
    .back-login-btn {
        position: absolute;
        top: 40px;  /* було 20px, зробили нижче */
        left: 40px; /* було 20px, відсунули далі від краю */
        z-index: 1000;
    }
    /* Для кнопки всередині адмінки додаємо відступ знизу */
    .back-link {
        margin-bottom: 20px;
    }

    /* Адмін-інтерфейс */
    #admin-interface { display: none; max-width: 800px; margin: 0 auto; }
    .admin-container { background: rgba(20, 25, 40, 0.95); border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #4a90e2; }
    h1 { color: #4a90e2; text-align: center; margin-top: 0; }
    
    .tabs { display: flex; gap: 5px; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: #111; border: 1px solid #444; color: #aaa; padding: 10px 15px; border-radius: 8px; cursor: pointer; flex: 1; text-align: center; }
    .tab-btn.active { background: #4a90e2; color: white; border-color: #4a90e2; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 15px; }
    label { display: block; color: #ffd700; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; background: #111; border: 1px solid #444; color: white; box-sizing: border-box; }
    .file-upload-wrapper { border: 1px dashed #4a90e2; padding: 10px; margin-bottom: 5px; border-radius: 8px; text-align: center; }
    
    .btn-submit { background: #2ecc71; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-danger { background: #e74c3c; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #loader { display: none; text-align: center; color: #ffd700; margin-top: 15px; }
</style>
</head>
<body>

    <div id="login-screen">
        <a href="index.html" class="back-login-btn"> Повернутися на головну </a>

        <div class="login-box">
            <h2>Вхід в адмінку</h2>
            <input type="password" id="pass-input" placeholder="Введіть пароль">
            <button class="btn-submit" onclick="checkLogin()">Увійти</button>
        </div>
    </div>


    <div id="admin-interface">
        <div class="admin-container">
            <a href="index.html" class="back-link">← Повернутися на сайт</a>
            <h1>⚙️ Панель керування</h1>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('tab-add', this)">🎬 Додати</button>
                <button class="tab-btn" onclick="showTab('tab-edit', this)">✏️ Редагувати</button>
                <button class="tab-btn" onclick="showTab('tab-carousel', this)">🖼️ Карусель</button>
            </div>

            <div id="tab-add" class="tab-content active">
                <form id="form-add">
                    <div class="form-group"><label>Назва:</label><input type="text" id="m-title" required></div>
                    <div class="form-group"><label>Рік:</label><input type="number" id="m-year" value="2026"></div>
                    <div class="form-group"><label>Рейтинг (від 0 до 10):</label><input type="number" id="m-rating" min="0" max="10" step="0.1" placeholder="8.5" required></div>
                    <div class="form-group"><label>Постер (URL):</label><input type="url" id="m-img" required></div>
                    <div class="form-group">
                        <label>🎬 Відео (URL або Файл з ПК):</label>
                        <div class="file-upload-wrapper"><input type="file" id="m-file-selector" accept="video/mp4"></div>
                        <input type="text" id="m-video" placeholder="Посилання або назва файлу" required>
                    </div>
                    <div class="form-group"><label>Якість (напр. FullHD 1080p):</label><input type="text" id="m-quality" required></div>
                    <div class="form-group"><label>Жанри (через кому):</label><input type="text" id="m-genre" placeholder="Бойовик, Драма, Комедія" required></div>
                    <div class="form-group"><label>Країна:</label><input type="text" id="m-country" placeholder="США, Україна" required></div>
                    <div class="form-group"><label>Опис:</label><textarea id="m-desc" rows="3"></textarea></div>
                    <button type="submit" class="btn-submit">➕ Додати фільм</button>
                </form>
            </div>

            <div id="tab-edit" class="tab-content">
                <div class="form-group">
                    <label>Оберіть фільм:</label>
                    <select id="edit-select" onchange="loadMovieToEdit()">
                        <option value="">-- Завантаження --</option>
                    </select>
                </div>
                <div id="edit-fields" style="display:none;">
                    <div class="form-group"><label>Назва:</label><input type="text" id="e-title"></div>
                    <div class="form-group"><label>Рік:</label><input type="number" id="e-year"></div>
                    <div class="form-group"><label>Рейтинг (0-10):</label><input type="number" id="e-rating" min="0" max="10" step="0.1"></div>
                    <div class="form-group"><label>Постер (URL):</label><input type="url" id="e-img"></div>
                    <div class="form-group">
                        <label>Відео:</label>
                        <div class="file-upload-wrapper"><input type="file" id="e-file-selector" accept="video/mp4"></div>
                        <input type="text" id="e-video">
                    </div>
                    <div class="form-group"><label>Якість:</label><input type="text" id="e-quality"></div>
                    <div class="form-group"><label>Жанри (через кому):</label><input type="text" id="e-genre"></div>
                    <div class="form-group"><label>Країна:</label><input type="text" id="e-country"></div>
                    <div class="form-group"><label>Опис:</label><textarea id="e-desc" rows="3"></textarea></div>
                    
                    <button class="btn-submit" onclick="saveChanges()">💾 Зберегти зміни</button>
                    <button class="btn-danger" onclick="deleteMovie()">🗑️ Видалити фільм</button>
                </div>
            </div>

            <div id="tab-carousel" class="tab-content">
                <form id="form-carousel">
                    <div class="form-group"><label>ID Каруселі (номер слайда):</label><input type="number" id="c-id" required></div>
                    <div class="form-group"><label>Зображення (URL):</label><input type="url" id="c-img" required></div>
                    <button type="submit" class="btn-submit">💾 Оновити карусель</button>
                </form>
            </div>

            <div id="loader">⏳ Синхронізація з сервером...</div>
        </div>
    </div>

    <script>
        let movies = [];

        function checkLogin() {
            if(document.getElementById('pass-input').value === 'kino2026') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-interface').style.display = 'block';
                fetchData();
            } else { alert('Невірний пароль!'); }
        }

        async function fetchData() {
            const res = await fetch('/api/admin/movies');
            movies = await res.json();
            updateSelect();
        }

        async function save() {
            document.getElementById('loader').style.display = 'block';
            await fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movies)
            });
            document.getElementById('loader').style.display = 'none';
            alert('✅ Дані успішно оновлено!');
            fetchData();
        }

        // ДОДАВАННЯ
        document.getElementById('form-add').addEventListener('submit', (e) => {
            e.preventDefault();
            movies.push({
                id: Date.now(),
                title: document.getElementById('m-title').value,
                year: document.getElementById('m-year').value,
                rating: document.getElementById('m-rating').value, // Нове поле рейтингу
                img: document.getElementById('m-img').value,
                video_1080: document.getElementById('m-video').value,
                quality: document.getElementById('m-quality').value,
                genre: document.getElementById('m-genre').value,
                country: document.getElementById('m-country').value,
                desc: document.getElementById('m-desc').value
            });
            save();
            document.getElementById('form-add').reset();
        });

        // ЗАВАНТАЖЕННЯ ДЛЯ РЕДАГУВАННЯ
        function updateSelect() {
            const sel = document.getElementById('edit-select');
            sel.innerHTML = '<option value="">-- Оберіть фільм --</option>';
            movies.forEach((m, i) => sel.innerHTML += `<option value="${i}">${m.title}</option>`);
        }

        function loadMovieToEdit() {
            const idx = document.getElementById('edit-select').value;
            if(idx === "") { document.getElementById('edit-fields').style.display = 'none'; return; }
            const m = movies[idx];
            document.getElementById('edit-fields').style.display = 'block';
            
            document.getElementById('e-title').value = m.title || '';
            document.getElementById('e-year').value = m.year || '';
            document.getElementById('e-rating').value = m.rating || ''; // Нове поле рейтингу
            document.getElementById('e-img').value = m.img || '';
            document.getElementById('e-video').value = m.video_1080 || '';
            document.getElementById('e-quality').value = m.quality || ''; 
            document.getElementById('e-genre').value = m.genre || ''; 
            document.getElementById('e-country').value = m.country || ''; 
            document.getElementById('e-desc').value = m.desc || '';
        }

        // ЗБЕРЕЖЕННЯ ЗМІН
        function saveChanges() {
            const idx = document.getElementById('edit-select').value;
            movies[idx].title = document.getElementById('e-title').value;
            movies[idx].year = document.getElementById('e-year').value;
            movies[idx].rating = document.getElementById('e-rating').value; // Нове поле рейтингу
            movies[idx].img = document.getElementById('e-img').value;
            movies[idx].video_1080 = document.getElementById('e-video').value;
            movies[idx].quality = document.getElementById('e-quality').value; 
            movies[idx].genre = document.getElementById('e-genre').value; 
            movies[idx].country = document.getElementById('e-country').value; 
            movies[idx].desc = document.getElementById('e-desc').value;
            save();
        }

        function deleteMovie() {
            const idx = document.getElementById('edit-select').value;
            if(confirm('Точно видалити цей фільм?')) {
                movies.splice(idx, 1);
                save();
            }
        }

        document.getElementById('form-carousel').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Логіка каруселі в розробці...');
        });

        document.getElementById('m-file-selector').addEventListener('change', (e) => {
            if(e.target.files.length) document.getElementById('m-video').value = e.target.files[0].name;
        });
        document.getElementById('e-file-selector').addEventListener('change', (e) => {
            if(e.target.files.length) document.getElementById('e-video').value = e.target.files[0].name;
        });

        function showTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
